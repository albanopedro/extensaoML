<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ML Metrics</title>
  <style>
    /* Popup tem tamanho livre: o navegador se ajusta ao conteudo, mas
       sem largura definida ele fica estreito demais. */
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      /* Fundo explicito: sem ele, navegador ou visualizador em modo escuro
         pinta o fundo de preto e o texto cinza some - justo na lista em que
         a pessoa confere os numeros. */
      background: #ffffff;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #3483fa;
    }

    /* Versao ao lado do nome: a pessoa confere se a atualizacao pegou. */
    #versao {
      font-size: 11px;
      font-weight: 400;
      color: #888;
    }

    /* Erro inesperado da leitura. Vermelho e acima de tudo: e a unica
       coisa do popup que pede uma acao imediata. */
    #erro {
      background: #fdecea;
      border: 1px solid #f5c2bd;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      line-height: 1.5;
      color: #8a1c13;
    }

    /* Tela que entregava numeros e parou: laranja, entre o erro (vermelho)
       e o resumo (cinza). Nao e falha da extensao nem estado normal. */
    #telas {
      background: #fff4e5;
      border: 1px solid #ffd8a8;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      line-height: 1.5;
      color: #8a5300;
    }

    /* O que esta acontecendo na aba aberta agora (ver situacaoDaAba). Azul
       claro: e informacao de contexto, nao erro nem alerta. */
    #aba {
      background: #eaf3ff;
      border: 1px solid #c4dcff;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #1f4b8e;
    }

    #resumo {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    #lista {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .item {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .item .linha {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .item .codigo { color: #666; }
    .item .numeros { font-weight: 600; white-space: nowrap; }

    /* O rastro de cada numero: de onde foi lido. Pequeno e cinza para nao
       competir com o numero, mas sempre visivel - e ele que permite conferir. */
    .item .origem {
      margin-top: 2px;
      font-size: 10.5px;
      color: #888;
      line-height: 1.35;
      word-break: break-word;
    }

    /* Conferencia: dois botoes pequenos por anuncio ("bate" / "nao bate").
       Ficam lado a lado, na linha de baixo do anuncio, e o escolhido fica
       colorido - a marca precisa ser visivel de relance quando ela reabrir
       o popup depois de olhar a tela do Mercado Livre. */
    .item .conferir {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .item .conferir button {
      width: auto;
      flex: 1;
      padding: 4px 6px;
      margin: 0;
      font-size: 11px;
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
    }

    .item .conferir button.bate-sim { background: #e6f7ed; color: #00733f; border-color: #00a650; }
    .item .conferir button.bate-nao { background: #fdecea; color: #a5160c; border-color: #d93025; }

    button {
      width: 100%;
      padding: 9px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    .principal { background: #3483fa; color: #fff; }
    .secundario { background: #ededed; color: #333; }
    .perigo { background: #fff; color: #d93025; border: 1px solid #d93025; }

    #aviso {
      margin-top: 10px;
      font-size: 12px;
      color: #00a650;
      text-align: center;
      min-height: 16px;
    }

    /* O texto do diagnostico fica sempre visivel depois do botao, para
       copiar na mao (Ctrl+C) quando o clipboard do navegador estiver
       bloqueado - ou so para ler o que a extensao viu. */
    #diagnostico {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      margin: 4px 0 12px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.45;
      resize: vertical;
    }
  </style>
</head>
<body>

<h1>ML Metrics <span id="versao"></span></h1>

<div id="erro" hidden=""></div>

<div id="telas" hidden=""></div>

<div id="aba" hidden=""></div>

<div id="resumo">Carregando...</div>

<div id="lista"></div>

<button id="conferencia" class="principal">Copiar conferência</button>
<button id="copiar" class="secundario">Copiar diagnóstico</button>
<button id="limpar" class="perigo">Limpar dados guardados</button>

<textarea id="diagnostico" readonly="" hidden=""></textarea>

<div id="aviso"></div>

<!-- Na ordem: popup.js usa as regras de leitura.js (mascarar endereco) e de
     gravacao.js (prefixo do historico). Sao os mesmos arquivos das abas, para
     a regra nao existir em duas copias. -->
<script src="leitura.js"></script>
<script src="gravacao.js"></script>
<script src="popup.js"></script>
</body>
</html>
